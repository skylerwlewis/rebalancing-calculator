version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # `applies-to` defaults to `version-updates`, so without the second group
      # below Dependabot raises security-update PRs one-per-dependency,
      # ungrouped and exempt from `open-pull-requests-limit`.
      all-dependencies:
        applies-to: version-updates
        patterns:
          - "*" # Groups every version update into one single PR
      all-security-updates:
        applies-to: security-updates
        patterns:
          - "*" # Groups every security update into one single PR
    ignore:
      # eslint-plugin-react@7.37.5 (latest) declares peer eslint@"^3 || ^4 || ^5 || ^6 || ^7 || ^8 || ^9.7",
      # so it doesn't support eslint 10 yet, and @eslint/js@10 declares peer eslint@"^10.0.0".
      # Unblock when eslint-plugin-react releases a version supporting eslint 10.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      # typescript-eslint@8.71.2 (latest) declares peer typescript@">=4.8.4 <6.1.0", and TypeScript 7
      # has no JS API for it to use. This holds every release from 6.1.0 on, not just majors, because
      # a 6.1 minor would already break that peer range. Unblock when typescript-eslint releases a
      # version supporting the newer TypeScript.
      - dependency-name: "typescript"
        versions: [">=6.1.0"]
      # react@19 / @mui/material(-icons)@9 upgrade is a deliberate, larger
      # change under manual review on deps/113-datagrid-followup, not a
      # technical blocker. Unblock by merging that branch and removing these
      # entries.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@mui/material"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@mui/icons-material"
        update-types: ["version-update:semver-major"]
      # 6.18.2 is pinned outright (not just major bumps): it's the last
      # version before the row-edit regression under review on
      # deps/113-datagrid-followup. Unblock by merging that branch and
      # removing this entry.
      - dependency-name: "@mui/x-data-grid"
