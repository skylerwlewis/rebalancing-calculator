version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      all-dependencies:
        patterns:
          - "*" # Groups every update into one single PR
    ignore:
      # eslint@10 / @eslint/js@10 conflict with eslint-plugin-react@7.37.5's peer
      # range ("^3 || ^4 || ^5 || ^6 || ^7 || ^8 || ^9.7"). Unblock when
      # eslint-plugin-react releases eslint 10 support.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      # typescript@7 conflicts with typescript-eslint@8.70.0's peer range
      # (">=4.8.4 <6.1.0"). Unblock when typescript-eslint releases TS 7 support.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # react@19 / @mui/material(-icons)@9 upgrade is a deliberate, larger
      # change under manual review on deps/113-datagrid-followup, not a
      # technical blocker. Unblock by merging that branch and removing these
      # entries.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@mui/material"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@mui/icons-material"
        update-types: ["version-update:semver-major"]
      # 6.18.2 is pinned outright (not just major bumps): it's the last
      # version before the row-edit regression under review on
      # deps/113-datagrid-followup. Unblock by merging that branch and
      # removing this entry.
      - dependency-name: "@mui/x-data-grid"
